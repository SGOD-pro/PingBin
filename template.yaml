AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  PingBin Serverless Waste Management System
  2-Lambda Architecture with SQS Decoupling, DynamoDB, Bedrock Nova Lite & S3

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: python3.13
    Architectures:
      - x86_64
    Environment:
      Variables:
        AWS_REGION: !Ref AWS::Region
        AWS_PROFILE: ""
        SQS_QUEUE_URL: !Ref PingBinQueue
        DYNAMODB_TABLE_REPORTS: !Ref ReportsTable
        DYNAMODB_TABLE_WORKERS: !Ref WorkersTable
        DYNAMODB_TABLE_VENDORS: !Ref VendorsTable
        DYNAMODB_TABLE_COUPONS: !Ref CouponsTable
        S3_BUCKET_IMAGES: !Ref ImagesBucket
        BEDROCK_MODEL_ID: amazon.nova-lite-v1:0
        WORKER_SEARCH_RADIUS_KM: "10.0"
        VENDOR_LOCAL_RADIUS_KM: "15.0"
        TEST_MODE_SECONDS: "false"
        TWILIO_ACCOUNT_SID: !Ref TwilioAccountSid
        TWILIO_AUTH_TOKEN: !Ref TwilioAuthToken
        TWILIO_WHATSAPP_FROM: !Ref TwilioWhatsAppFrom

Parameters:
  TwilioAccountSid:
    Type: String
    Description: Twilio Account SID
  TwilioAuthToken:
    Type: String
    NoEcho: true
    Description: Twilio Auth Token
  TwilioWhatsAppFrom:
    Type: String
    Default: 'whatsapp:+14155238886'
    Description: Twilio WhatsApp Sandbox Number

Resources:
  # -------------------------------------------------------------
  # API Gateway (HTTP API v2)
  # -------------------------------------------------------------
  PingBinHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowOrigins:
          - '*'

  # -------------------------------------------------------------
  # SQS Message Queue
  # -------------------------------------------------------------
  PingBinQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: pingbin-messages
      VisibilityTimeout: 65
      MessageRetentionPeriod: 86400

  # -------------------------------------------------------------
  # S3 Bucket for Before / After Photos
  # -------------------------------------------------------------
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'pingbin-images-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  # -------------------------------------------------------------
  # DynamoDB Tables
  # -------------------------------------------------------------
  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Reports
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: report_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: report_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  WorkersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Workers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: worker_id
          AttributeType: S
      KeySchema:
        - AttributeName: worker_id
          KeyType: HASH

  VendorsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Vendors
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: vendor_id
          AttributeType: S
      KeySchema:
        - AttributeName: vendor_id
          KeyType: HASH

  CouponsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Coupons
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: coupon_id
          AttributeType: S
      KeySchema:
        - AttributeName: coupon_id
          KeyType: HASH

  # -------------------------------------------------------------
  # Lambda 1: Webhook Receiver (<500ms Twilio response -> SQS)
  # -------------------------------------------------------------
  WebhookReceiverFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: pingbin-webhook-receiver
      CodeUri: backend/src/
      Handler: webhook_receiver.lambda_handler
      Timeout: 5
      MemorySize: 256
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt PingBinQueue.QueueName
      Events:
        WebhookApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref PingBinHttpApi
            Path: /webhook
            Method: POST

  # -------------------------------------------------------------
  # Lambda 2: Async Processor & API Gateway Endpoints
  # -------------------------------------------------------------
  ProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: pingbin-processor
      CodeUri: backend/src/
      Handler: processor.lambda_handler
      Timeout: 60
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReportsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref VendorsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CouponsTable
        - S3CrudPolicy:
            BucketName: !Ref ImagesBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt PingBinQueue.Arn
            BatchSize: 5
        GetReports:
          Type: HttpApi
          Properties:
            ApiId: !Ref PingBinHttpApi
            Path: /reports
            Method: GET
        GetVendors:
          Type: HttpApi
          Properties:
            ApiId: !Ref PingBinHttpApi
            Path: /vendors
            Method: GET
        PostVendors:
          Type: HttpApi
          Properties:
            ApiId: !Ref PingBinHttpApi
            Path: /vendors
            Method: POST
        GetCoupons:
          Type: HttpApi
          Properties:
            ApiId: !Ref PingBinHttpApi
            Path: /coupons
            Method: GET
        GetSeed:
          Type: HttpApi
          Properties:
            ApiId: !Ref PingBinHttpApi
            Path: /seed
            Method: GET

Outputs:
  HttpApiUrl:
    Description: HTTP API Gateway endpoint URL
    Value: !Sub 'https://${PingBinHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  WebhookReceiverArn:
    Description: Webhook Receiver Lambda Function ARN
    Value: !GetAtt WebhookReceiverFunction.Arn
  ProcessorFunctionArn:
    Description: Processor Lambda Function ARN
    Value: !GetAtt ProcessorFunction.Arn
  SQSQueueUrl:
    Description: SQS Queue URL
    Value: !Ref PingBinQueue
