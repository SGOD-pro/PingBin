AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  PingBin Serverless Waste Management System
  2-Lambda Architecture with SQS Decoupling, DynamoDB, Bedrock Nova Lite & S3

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: python3.13
    Architectures:
      - x86_64
    Environment:
      Variables:
        ENV: production
        FRONTEND_URL: !Ref FrontendUrl
        SQS_QUEUE_URL: !Ref PingBinQueue
        DYNAMODB_TABLE_REPORTS: !Ref ReportsTableName
        DYNAMODB_TABLE_WORKERS: !Ref WorkersTableName
        DYNAMODB_TABLE_VENDORS: !Ref VendorsTableName
        DYNAMODB_TABLE_COUPONS: !Ref CouponsTableName
        S3_BUCKET_IMAGES: !Ref ImagesBucketName
        BEDROCK_MODEL_ID: amazon.nova-lite-v1:0
        WORKER_SEARCH_RADIUS_KM: "10.0"
        VENDOR_LOCAL_RADIUS_KM: "15.0"
        TEST_MODE_SECONDS: "false"
        TWILIO_ACCOUNT_SID: !Ref TwilioAccountSid
        TWILIO_AUTH_TOKEN: !Ref TwilioAuthToken
        TWILIO_WHATSAPP_FROM: !Ref TwilioWhatsAppFrom

Parameters:
  TwilioAccountSid:
    Type: String
    Description: Twilio Account SID
  TwilioAuthToken:
    Type: String
    NoEcho: true
    Description: Twilio Auth Token
  TwilioWhatsAppFrom:
    Type: String
    Default: 'whatsapp:+14155238886'
    Description: Twilio WhatsApp Sandbox Number
  ReportsTableName:
    Type: String
    Default: 'Reports'
    Description: DynamoDB Reports table name
  WorkersTableName:
    Type: String
    Default: 'Workers'
    Description: DynamoDB Workers table name
  VendorsTableName:
    Type: String
    Default: 'Vendors'
    Description: DynamoDB Vendors table name
  CouponsTableName:
    Type: String
    Default: 'Coupons'
    Description: DynamoDB Coupons table name
  ImagesBucketName:
    Type: String
    Default: 'cleanloop-images-ap-south-1'
    Description: S3 Bucket for waste images
  FrontendUrl:
    Type: String
    Default: 'https://ping-bin-qorc.vercel.app'
    Description: Deployed Vercel Frontend URL

Resources:
  # -------------------------------------------------------------
  # API Gateway (HTTP API v2)
  # -------------------------------------------------------------
  PingBinHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Amz-Date
          - X-Api-Key
          - X-Amz-Security-Token
        AllowOrigins:
          - 'https://ping-bin-qorc.vercel.app'
          - 'http://localhost:5173'
          - 'http://localhost:3000'
          - '*'

  # -------------------------------------------------------------
  # SQS Message Queue
  # -------------------------------------------------------------
  PingBinQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: pingbin-messages
      VisibilityTimeout: 65
      MessageRetentionPeriod: 86400

  # -------------------------------------------------------------
  # Lambda 1: Webhook Receiver (<500ms Twilio response -> SQS)
  # -------------------------------------------------------------
  WebhookReceiverFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: pingbin-webhook-receiver
      CodeUri: backend/src/
      Handler: webhook_receiver.lambda_handler
      Timeout: 5
      MemorySize: 256
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt PingBinQueue.QueueName
      Events:
        WebhookApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref PingBinHttpApi
            Path: /webhook
            Method: POST

  # -------------------------------------------------------------
  # Lambda 2: Async Processor & API Gateway Endpoints
  # -------------------------------------------------------------
  ProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: pingbin-processor
      CodeUri: backend/src/
      Handler: processor.lambda_handler
      Timeout: 60
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReportsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkersTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref VendorsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref CouponsTableName
        - S3CrudPolicy:
            BucketName: !Ref ImagesBucketName
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt PingBinQueue.Arn
            BatchSize: 5
        GetHealth:
          Type: HttpApi
          Properties:
            ApiId: !Ref PingBinHttpApi
            Path: /health
            Method: GET
        GetReports:
          Type: HttpApi
          Properties:
            ApiId: !Ref PingBinHttpApi
            Path: /reports
            Method: GET
        GetWorkers:
          Type: HttpApi
          Properties:
            ApiId: !Ref PingBinHttpApi
            Path: /workers
            Method: GET
        PostWorkers:
          Type: HttpApi
          Properties:
            ApiId: !Ref PingBinHttpApi
            Path: /workers
            Method: POST
        GetVendors:
          Type: HttpApi
          Properties:
            ApiId: !Ref PingBinHttpApi
            Path: /vendors
            Method: GET
        PostVendors:
          Type: HttpApi
          Properties:
            ApiId: !Ref PingBinHttpApi
            Path: /vendors
            Method: POST
        GetCoupons:
          Type: HttpApi
          Properties:
            ApiId: !Ref PingBinHttpApi
            Path: /coupons
            Method: GET
        GetSeed:
          Type: HttpApi
          Properties:
            ApiId: !Ref PingBinHttpApi
            Path: /seed
            Method: GET

Outputs:
  HttpApiUrl:
    Description: HTTP API Gateway endpoint URL
    Value: !Sub 'https://${PingBinHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  WebhookReceiverArn:
    Description: Webhook Receiver Lambda Function ARN
    Value: !GetAtt WebhookReceiverFunction.Arn
  ProcessorFunctionArn:
    Description: Processor Lambda Function ARN
    Value: !GetAtt ProcessorFunction.Arn
  SQSQueueUrl:
    Description: SQS Queue URL
    Value: !Ref PingBinQueue
