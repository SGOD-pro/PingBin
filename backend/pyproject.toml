[project]
name = "backend"
version = "0.1.0"
description = "PingBin Backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.76",
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "twilio>=9.11.0",
    "uvicorn>=0.52.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-benchmark>=5.2.3",
    "pytest-mock>=3.15.1",
]
