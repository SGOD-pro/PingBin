[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Souvik Karmakar", email = "hackgodsk112@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.76",
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "twilio>=9.11.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-benchmark>=5.2.3",
    "pytest-mock>=3.15.1",
]
